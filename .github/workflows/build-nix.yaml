name: Publish Docker image built by nix to ghcr.io

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  # Discover packages and their target platforms from the flake.
  get-packages:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.get-packages.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: get Nix packages
        id: get-packages
        shell: bash
        run: |
          set -euo pipefail
          cd nix
          # {"packages": {"x86_64-linux": {...}, "aarch64-linux": {...}}}
          # -> {"include":[{"package":"pvc-backup",
          #                 "platforms":"[\"linux/amd64\",\"linux/arm64\"]"}, ...]}
          matrix="$(nix flake show --json | jq -c '
            [.packages | to_entries[]
              | .key as $system
              | .value | keys[] as $package
              | {package: $package, system: $system}]
            | group_by(.package)
            | {include: map({
                package: .[0].package,
                platforms: ([.[].system]
                  | map({"x86_64-linux": "linux/amd64", "aarch64-linux": "linux/arm64"}[.]
                    // error("unmapped system: \(.) — add it to the platform map in build-nix.yaml"))
                  | sort | tojson)
              })}')"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build-package:
    needs: get-packages

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.get-packages.outputs.matrix) }}

    uses: ./.github/workflows/_build-nix-app.yml
    with:
      package: ${{ matrix.package }}
      platforms: ${{ matrix.platforms }}
    secrets: inherit
