name: Publish Docker image to ghcr.io

on: push

permissions:
  contents: read
  packages: write

jobs:
  # Single matrix of apps. Each entry dispatches to the reusable workflow,
  # which handles the existence check, per-platform build (push-by-digest),
  # and atomic multi-arch merge.
  #
  # Adding an app = one line here (app + comma-separated platforms).
  # To make an app multi-platform, just list more platforms, e.g.
  #   platforms: linux/amd64,linux/arm64
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: toolbox
            platforms: linux/amd64
          - app: alertmanager-discord
            platforms: linux/amd64
          - app: yorksap-frontend
            platforms: linux/amd64
          - app: rsyncd
            platforms: linux/amd64
          - app: factorio-workspace
            platforms: linux/amd64
          - app: dawarich
            platforms: linux/amd64
          - app: elasticsearch
            platforms: linux/amd64,linux/arm64

    uses: ./.github/workflows/_build-app.yml
    with:
      app: ${{ matrix.app }}
      platforms: ${{ matrix.platforms }}
    secrets: inherit
